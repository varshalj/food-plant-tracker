<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b84ff"/>
      <stop offset="100%" style="stop-color:#0b6bff"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  
  <!-- Plant/leaf icon -->
  <g transform="translate(256, 240)">
    <!-- Main leaf -->
    <path d="M-20 100 Q-20 -50 80 -120 Q50 -25 50 80 Q50 120 0 135 Q-40 120 -20 100 Z" 
          fill="url(#leaf)" 
          transform="rotate(-15)"/>
    
    <!-- Second leaf -->
    <path d="M20 100 Q20 -50 -80 -120 Q-50 -25 -50 80 Q-50 120 0 135 Q40 120 20 100 Z" 
          fill="url(#leaf)" 
          transform="rotate(15)" 
          opacity="0.85"/>
    
    <!-- Stem -->
    <rect x="-12" y="100" width="24" height="70" rx="12" fill="#16a34a"/>
  </g>
  
  <!-- "30" text -->
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="64" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle">30</text>
</svg>
